<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetPlanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Dezentes Styling für editierbare Tabellenzellen */
    [contenteditable="true"]:hover {
      outline: 1px dashed #94a3b8;
      border-radius: 4px;
      background-color: #f8fafc;
    }
    [contenteditable="true"]:focus {
      outline: 2px solid #3b82f6;
      border-radius: 4px;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          €
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">BudgetPlanner</h1>
          <p class="text-xs text-slate-500">Heimserver Edition</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <select id="projectSelect" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white font-medium shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="loadProject(this.value)">
        </select>
        <button onclick="createProjectPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3.5 py-1.5 rounded-lg shadow-sm transition">
          + Projekt
        </button>
      </div>
    </div>
  </header>

  <!-- Hauptinhalt -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-6">

    <!-- KPI Dashboard Card -->
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 divide-y md:divide-y-0 md:divide-x divide-slate-100">
        
        <div class="pt-2 md:pt-0">
          <span class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Best Case (Min)</span>
          <div id="statMin" class="text-3xl font-extrabold text-slate-900 mt-1">0,00 €</div>
          <p class="text-xs text-slate-400 mt-1">Günstigste denkbare Ausführung</p>
        </div>

        <div class="pt-4 md:pt-0 md:pl-6">
          <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Erwartet (Plan)</span>
          <div id="statExpected" class="text-3xl font-extrabold text-indigo-600 mt-1">0,00 €</div>
          <p class="text-xs text-slate-400 mt-1">Zentraler Budgetwert</p>
        </div>

        <div class="pt-4 md:pt-0 md:pl-6">
          <span class="text-xs font-semibold uppercase tracking-wider text-rose-600">Worst Case (Max)</span>
          <div id="statMax" class="text-3xl font-extrabold text-slate-900 mt-1">0,00 €</div>
          <p class="text-xs text-slate-400 mt-1">Inklusive Risiken & Puffer</p>
        </div>
      </div>

      <!-- Kosten-Bandbreiten Balken -->
      <div class="mt-6 pt-6 border-t border-slate-100">
        <div class="flex justify-between text-xs text-slate-500 font-medium mb-1.5">
          <span>Min: <span id="barMin">0 €</span></span>
          <span class="text-indigo-600 font-semibold">Spanne: <span id="barDiff">0 €</span></span>
          <span>Max: <span id="barMax">0 €</span></span>
        </div>
        <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden flex">
          <div class="bg-emerald-400 h-full w-1/3"></div>
          <div class="bg-indigo-500 h-full w-1/3"></div>
          <div class="bg-rose-400 h-full w-1/3"></div>
        </div>
      </div>
    </div>

    <!-- Kategorien & Tabellen Container -->
    <div id="categoriesContainer" class="space-y-6"></div>

    <!-- Button Kategorie hinzufügen -->
    <div>
      <button onclick="addCategoryPrompt()" class="inline-flex items-center gap-2 border border-dashed border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-600 bg-white hover:bg-indigo-50/50 text-sm font-medium px-5 py-3 rounded-xl transition w-full justify-center">
        <span>+ Neue Kategorie anlegen</span>
      </button>
    </div>
  </main>

  <script>
    let currentProjectId = null;

    async function init() {
      const res = await fetch('/api/projects');
      const projects = await res.json();
      const select = document.getElementById('projectSelect');
      select.innerHTML = '';
      
      if (projects.length === 0) {
        const newProj = await fetch('/api/projects', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name: 'Mein erstes Vorhaben (z. B. Umzug)' })
        }).then(r => r.json());
        projects.push(newProj);
      }

      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      });

      currentProjectId = projects[0].id;
      loadProject(currentProjectId);
    }

    async function loadProject(id) {
      currentProjectId = id;
      const res = await fetch(`/api/projects/${id}`);
      const data = await res.json();

      const min = data.summary.totalMin || 0;
      const exp = data.summary.totalExpected || 0;
      const max = data.summary.totalMax || 0;

      document.getElementById('statMin').textContent = fmt(min);
      document.getElementById('statExpected').textContent = fmt(exp);
      document.getElementById('statMax').textContent = fmt(max);

      document.getElementById('barMin').textContent = fmt(min);
      document.getElementById('barMax').textContent = fmt(max);
      document.getElementById('barDiff').textContent = fmt(max - min);

      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      data.categories.forEach(cat => {
        const catCard = document.createElement('div');
        catCard.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden';
        
        let rows = cat.items.map(i => `
          <tr class="border-t border-slate-100 hover:bg-slate-50/80 transition-colors text-sm group">
            <!-- Name & Link -->
            <td class="p-3.5">
              <div class="flex items-center gap-2">
                <span contenteditable="true" 
                      onblur="updateItem(${i.id}, 'name', this.innerText)" 
                      onkeydown="handleKey(event)" 
                      class="font-medium text-slate-800 px-1 py-0.5">${escapeHtml(i.name)}</span>
                ${i.url ? `<a href="${escapeHtml(i.url)}" target="_blank" class="text-slate-400 hover:text-indigo-600 transition" title="Link öffnen">↗</a>` : ''}
              </div>
            </td>

            <!-- Fälligkeit -->
            <td class="p-3.5 text-slate-500">
              <input type="date" value="${i.due_date || ''}" 
                     onchange="updateItem(${i.id}, 'dueDate', this.value)"
                     class="bg-transparent border-0 text-slate-600 text-xs focus:ring-1 focus:ring-indigo-500 rounded px-1 cursor-pointer">
            </td>

            <!-- Kosten Min -->
            <td class="p-3.5 text-right font-mono text-emerald-700">
              <span contenteditable="true" 
                    onblur="updateItemPrice(${i.id}, 'costMin', this.innerText)" 
                    onkeydown="handleKey(event)" 
                    class="px-1 py-0.5">${parseNum(i.cost_min).toFixed(2)}</span> €
            </td>

            <!-- Kosten Erwartet -->
            <td class="p-3.5 text-right font-mono font-semibold text-slate-900 bg-slate-50/50">
              <span contenteditable="true" 
                    onblur="updateItemPrice(${i.id}, 'costExpected', this.innerText)" 
                    onkeydown="handleKey(event)" 
                    class="px-1 py-0.5">${parseNum(i.cost_expected).toFixed(2)}</span> €
            </td>

            <!-- Kosten Max -->
            <td class="p-3.5 text-right font-mono text-rose-700">
              <span contenteditable="true" 
                    onblur="updateItemPrice(${i.id}, 'costMax', this.innerText)" 
                    onkeydown="handleKey(event)" 
                    class="px-1 py-0.5">${parseNum(i.cost_max).toFixed(2)}</span> €
            </td>

            <!-- Link editieren / Löschen -->
            <td class="p-3.5 text-center">
              <div class="flex items-center justify-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="editUrlPrompt(${i.id}, '${escapeHtml(i.url || '')}')" title="Link bearbeiten" class="text-slate-400 hover:text-indigo-600 p-1">🔗</button>
                <button onclick="deleteItem(${i.id})" title="Löschen" class="text-slate-400 hover:text-rose-500 p-1 font-bold">✕</button>
              </div>
            </td>
          </tr>
        `).join('');

        catCard.innerHTML = `
          <div class="bg-slate-50/80 px-5 py-3.5 flex justify-between items-center border-b border-slate-200">
            <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
              <span>${escapeHtml(cat.name)}</span>
              <span class="text-xs font-normal text-slate-400">(${cat.items.length} Posten)</span>
            </h3>
            <button onclick="addItemPrompt(${cat.id})" class="text-xs font-semibold bg-white border border-slate-300 hover:border-slate-400 text-slate-700 px-3 py-1.5 rounded-lg shadow-sm transition">
              + Posten hinzufügen
            </button>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 bg-white">
                  <th class="p-3.5">Posten / Leistung</th>
                  <th class="p-3.5 w-36">Fälligkeit</th>
                  <th class="p-3.5 text-right w-28">Min (€)</th>
                  <th class="p-3.5 text-right w-28 bg-slate-50/50">Plan (€)</th>
                  <th class="p-3.5 text-right w-28">Max (€)</th>
                  <th class="p-3.5 text-center w-16"></th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="6" class="p-6 text-center text-sm text-slate-400 italic">Noch keine Posten in dieser Kategorie vorhanden.</td></tr>'}
              </tbody>
            </table>
          </div>
        `;
        container.appendChild(catCard);
      });
    }

    // Hilfsfunktionen
    function fmt(val) {
      return (Number(val) || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    }

    function parseNum(val) {
      if (typeof val === 'number') return val;
      return parseFloat(String(val).replace(',', '.')) || 0;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
    }

    function handleKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.target.blur(); // Triggert das Speichern via onblur
      }
    }

    // API Aufrufe für Updates
    async function updateItem(id, field, value) {
      await fetch(`/api/items/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ [field]: value })
      });
      loadProject(currentProjectId);
    }

    async function updateItemPrice(id, field, value) {
      const num = parseNum(value);
      await fetch(`/api/items/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ [field]: num })
      });
      loadProject(currentProjectId);
    }

    async function editUrlPrompt(id, currentUrl) {
      const url = prompt('Link zum Angebot/Produkt:', currentUrl);
      if (url === null) return;
      await updateItem(id, 'url', url);
    }

    async function createProjectPrompt() {
      const name = prompt('Projektname:');
      if (!name) return;
      await fetch('/api/projects', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name })
      });
      init();
    }

    async function addCategoryPrompt() {
      const name = prompt('Name der Kategorie (z. B. Transport, Behörden, Material):');
      if (!name) return;
      await fetch('/api/categories', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ projectId: currentProjectId, name })
      });
      loadProject(currentProjectId);
    }

    async function addItemPrompt(categoryId) {
      const name = prompt('Bezeichnung des Postens:');
      if (!name) return;
      const expected = parseNum(prompt('Erwartete Kosten (€):') || 0);
      const min = parseNum(prompt('Minimale Kosten (€):', expected) || expected);
      const max = parseNum(prompt('Maximale Kosten (€):', expected) || expected);
      const dueDate = prompt('Fälligkeitsdatum (JJJJ-MM-TT) [optional]:');
      const url = prompt('Link zum Angebot [optional]:');

      await fetch('/api/items', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          categoryId,
          name,
          costExpected: expected,
          costMin: min,
          costMax: max,
          dueDate,
          url
        })
      });
      loadProject(currentProjectId);
    }

    async function deleteItem(id) {
      if (!confirm('Posten wirklich löschen?')) return;
      await fetch(`/api/items/${id}`, { method: 'DELETE' });
      loadProject(currentProjectId);
    }

    init();
  </script>
</body>
</html>
