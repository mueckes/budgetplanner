# BudgetPlanner Knowledge Graph v1.0
meta:
  project: budgetplanner
  architecture: monolith-docker-sqlite
  version: 1.3.0

nodes:
  # --- DOMAIN CONCEPTS ---
  concept:pert:
    type: concept
    spec: .context/nodes/pert_logic.md
    defines: [cost_min, cost_expected, cost_max, bandwidth]
  concept:templates:
    type: concept
    instances: [moving, renovation, empty]
  concept:cashflow:
    type: concept
    grouped_by: due_date (YYYY-MM)
    note: optional planned due-date view, not a bank balance forecast
  concept:project_budget:
    type: concept
    optional: true
    forecast: paid items use actual_cost, other items use cost_expected
  concept:payment:
    type: concept
    statuses: [planned, ordered, paid]
    note: one actual amount and optional paid date per item
  concept:accounts:
    type: concept
    spec: .context/nodes/accounts.md
    note: separate accounts, session authentication, per-project ownership
  concept:url_scraping:
    type: concept
    spec: .context/nodes/scraper_policy.md
    parser: cheerio

  # --- DATA STORAGE ---
  db:sqlite:
    type: storage
    file: data/budget.sqlite
    spec: .context/nodes/schema.md
    tables: [users, sessions, projects, categories, budget_items]

  # --- BACKEND (API & SERVICES) ---
  api:projects:
    file: src/server.js
    endpoints:
      - "GET /api/projects"
      - "POST /api/projects (template and optional budget in JSON body)"
      - "GET /api/projects/:id"
      - "PUT /api/projects/:id"
      - "DELETE /api/projects/:id"
      - "GET /api/projects/:id/completeness"
      - "GET /api/projects/:id/timeline"
      - "GET /api/projects/:id/export"
      - "POST /api/import (creates a new project)"
  api:categories:
    file: src/server.js
    endpoints: ["POST /api/categories", "PUT /api/categories/:id", "DELETE /api/categories/:id"]
  api:items:
    file: src/server.js
    endpoints: ["POST /api/items", "PUT /api/items/:id", "DELETE /api/items/:id"]
  api:auth:
    file: src/auth.js
    endpoints: ["POST /api/auth/login", "GET /api/auth/me", "PUT /api/auth/profile", "PUT /api/auth/password", "POST /api/auth/logout"]
    note: all API routes require login except login; project and child resources enforce ownership
  api:scraper:
    file: src/server.js
    endpoints: ["POST /api/scrape-url"]

  # --- FRONTEND UI ---
  ui:theme:
    type: presentation
    assets: [src/public/hausplan-wallpaper.webp]
    files: [src/public/index.html, src/public/login.html]
    note: "Helles Hausplan-Wallpaper mit Aufhellung, deckende Karten und grüne Akzente."
  ui:dashboard:
    file: src/public/index.html
    sections: [statMin, statExpected, statMax, barDiff]
    responsive: "Bis 640px: umgebrochene Navigation und Kostenpunkt-/Fälligkeitskarten; darüber Tabellenansicht."
  ui:login:
    file: src/public/login.html
    note: accounts are provisioned locally by the server administrator
  ui:account_settings:
    file: src/public/index.html
    functions: [editAccount, editPassword]
    note: own display name, optional email and password; no email recovery
  ui:modal_item:
    file: src/public/index.html
    functions: [addItemPrompt, scrapeCurrentUrl, submitNewItem]
    bounds: "Beim Speichern: leeres Min = Plan × 0,90; leeres Max = Plan × 1,15. Produktabruf: Min × 0,95, Max × 1,10. Vorschläge: Min × 0,80, Max × 1,30."
  ui:action_dialog:
    file: src/public/index.html
    functions: [showAction, editProject, editCategory, editPayment, deleteProject, deleteCategory]
    note: reusable in-page form and confirmation dialogs with inline errors
  ui:suggestions:
    file: src/public/index.html
    functions: [suggestedCategory, addSuggestedItem]
    note: category is selectable; keyword match preselects a suitable existing category
  ui:category_accordion:
    file: src/public/index.html
    functions: [renderCategories, categoryIsOpen, rememberCategory]
    note: categories collapse with plan totals; open state is stored locally per account and project
  ui:views:
    file: src/public/index.html
    modes: [overview, categories, timeline]
    note: overview includes up to three open due items and links to suggestions; project and account actions are in menus

  # --- INFRASTRUCTURE ---
  infra:reverse_proxy:
    spec: .context/nodes/deployment.md
    components: [nginx, basic_auth, dual_ssl, docker_bridge]
  infra:static_html:
    file: src/server.js
    note: HTML responses use Cache-Control no-store to avoid stale interfaces after deployment

edges:
  - { from: concept:pert,         rel: implements,  to: [db:sqlite, ui:dashboard] }
  - { from: concept:url_scraping, rel: served_by,   to: api:scraper }
  - { from: api:scraper,          rel: triggers,    to: ui:modal_item }
  - { from: concept:templates,    rel: seeds,       to: db:sqlite }
  - { from: concept:project_budget, rel: uses, to: [db:sqlite, ui:dashboard] }
  - { from: concept:payment, rel: uses, to: [db:sqlite, api:items] }
  - { from: concept:accounts, rel: protects, to: [db:sqlite, api:projects, api:items, api:categories] }
  - { from: infra:reverse_proxy,  rel: protects,    to: [api:projects, ui:views] }
