version: '3.8'

services:
  budget-app:
    image: node:20-alpine # bzw. das fertige Image der App
    container_name: project-budget-planner
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/app/data        # Hier liegt die SQLite-Datei
      - ./backups:/app/backups  # Automatische JSON-Dumps
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/budget.sqlite
      - BASE_URL=https://budget.meinedomain.de
    ports:
      - "127.0.0.1:3000:3000"   # Nur lokal binden, Reverse Proxy übernimmt SSL
